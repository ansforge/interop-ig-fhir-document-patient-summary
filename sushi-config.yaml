# Documentation à propos de cette page : https://fshschool.org/docs/sushi/configuration/

id: ans.fhir.fr.fr-patient-summary
canonical: https://interop.esante.gouv.fr/ig/fhir/fr-patient-summary # the last part of canonical and id must be the same
name: FRPatientSummary # Should be an acronym
title: FR Patient Summary (FHIR)
description: Volet de Synthèse Médicale (International Patient Summary) - Spécifications FHIR
publisher:
  name: Agence du Numérique en Santé (ANS) - 2-10 Rue d'Oradour-sur-Glane, 75015 Paris
  url: https://esante.gouv.fr
status: draft # draft | active | retired | unknown
version: 0.1.0 # shall conforms to Semantic Versioning https://fr.wiktionary.org/wiki/SemVer
fhirVersion: 4.0.1
copyrightYear: 2020+
releaseLabel: ci-build 
# le release label doit être conforme au cycle de vie de la doctrine du ci-sis. Cf. https://interop.esante.gouv.fr/ig/documentation/mod_bonnes_pratiques.html#release-dun-ig-fhir colonne "label de publication"
# Valeurs permises : ci-build | draft | qa-preview | ballot | trial-use | release | update | normative+trial-use

jurisdiction: urn:iso:std:iso:3166#FR "France (la)"

parameters: #Parameters list - https://build.fhir.org/ig/FHIR/fhir-tools-ig/CodeSystem-ig-parameters.html
    shownav: 'true'
    path-expansion-params: '../../expansion-params.json' # for using French SNOMED CT Extension
    pin-canonicals: pin-all
    path-suppressed-warnings: input/ignoreWarnings.txt
    apply-contact: true
    show-inherited-invariants: true
    logging:
      - tx #tx: Messages describing the use of the terminology server (for debugging)
      - html #html: Log when validating an html page (troubleshooting only - leave off)
      - generate #generate: Log when producing an individual resource (troubleshooting only - leave off)
      - init #init: Messages describing the start up process (for debugging)
      - progress #progress: Overall progress messages
    i18n-default-lang: fr # Default language
    apply-jurisdiction: true
    i18n-lang:
      - en
    translation-sources:
      - input/translations/en


# L'IG CDA de la Synthèse Médicale est publié séparément (IG "interop-ig-cda-document-patient-summary").
# Cet IG conserve le modèle logique métier et le mapping ML/CDA/FHIR ; l'IG CDA y renverra par des liens.
dependencies:
  hl7.fhir.fr.core: 2.1.0
  hl7.fhir.uv.xver-r5.r4: 0.1.0
  hl7.fhir.uv.extensions.r4: 5.3.0
  ans.fhir.fr.annuaire: 1.1.0
  hl7.fhir.uv.fhir-clinical-document: latest
  ihe.pharm.mpd: 1.0.0-comment-2
  ans.fr.terminologies: latest
  ans.fhir.fr.document-core: current
  # ans.fr.document-core : modèle logique métier (parent de FRLMPatientSummaryDocument)
  ans.fr.document-core: current

